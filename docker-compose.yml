services:
  mongo:
    image: mongo:7
    restart: unless-stopped
    volumes:
      - mongo-data:/data/db
    ports:
      - "27017:27017"

  ml-service:
    build: ./ml-service
    restart: unless-stopped
    expose:
      - "8000"

  backend:
    build: ./backend
    restart: unless-stopped
    env_file:
      - ./backend/.env
    environment:
      NODE_ENV: production
      MONGO_URI: mongodb://mongo:27017/fundy
      ML_SERVICE_URL: http://ml-service:8000
    ports:
      - "4000:4000"
    depends_on:
      - mongo
      - ml-service

  frontend:
    build: ./frontend
    restart: unless-stopped
    ports:
      - "8080:80"

volumes:
  mongo-data:
