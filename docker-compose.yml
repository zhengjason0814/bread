name: bread

services:
  mongo:
    image: mongo:7
    restart: unless-stopped
    volumes:
      - mongo-data:/data/db
    ports:
      - "27017:27017"

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    expose:
      - "6379"

  ml-service:
    build: ./ml-service
    restart: unless-stopped
    expose:
      - "8000"

  backend:
    build: ./backend
    restart: unless-stopped
    env_file:
      - ./backend/.env
    environment:
      NODE_ENV: production
      MONGO_URI: mongodb://mongo:27017/bread
      ML_SERVICE_URL: http://ml-service:8000
      REDIS_URL: redis://redis:6379
    depends_on:
      - mongo
      - ml-service
      - redis
    deploy:
      replicas: 3

  frontend:
    build: ./frontend
    restart: unless-stopped
    ports:
      - "8080:80"
    depends_on:
      - backend

volumes:
  mongo-data:
